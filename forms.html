<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f3">
<title>ارتباط و همکاری | رنگ‌نوا</title>

<style>
:root {
  --bg:#f5f5f3;
  --card:#fff;
  --ink:#202020;
  --muted:#666;
  --line:#dedede;
  --gold:#98732f;
  --green:#245b52;
  --danger:#b42318;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Tahoma,Arial,sans-serif;
  line-height:1.9;
}
.wrap { width:min(900px,92%); margin:auto; }
header {
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:18px 0;
}
.header-inner {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
.brand { font-size:22px; font-weight:bold; color:var(--green); }
header a { color:var(--green); text-decoration:none; }
main { padding:35px 0 60px; }
h1 { font-size:25px; margin:0 0 8px; }
h2 { font-size:19px; margin:0 0 12px; }
p { color:var(--muted); margin:5px 0; }
.intro { margin-bottom:22px; }
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
  margin:18px 0;
  box-shadow:0 8px 25px #00000008;
}
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0; }
.tabs button {
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:10px;
  padding:11px 16px;
  font:inherit;
  cursor:pointer;
}
.tabs button.active {
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}
.panel { display:none; }
.panel.active { display:block; }
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field { margin:12px 0; }
.field.full { grid-column:1/-1; }
label { display:block; font-weight:bold; margin-bottom:5px; }
input,select,textarea {
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
  color:#222;
  font:inherit;
}
textarea { min-height:115px; resize:vertical; }
input:focus,select:focus,textarea:focus {
  outline:2px solid #98732f55;
  border-color:var(--gold);
}
button.submit {
  width:100%;
  margin-top:12px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.55; cursor:not-allowed; }
.message {
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  direction:rtl;
}
.message.show { display:block; }
.message.success { background:#eaf7ef; color:#18794e; }
.message.error { background:#fff0ef; color:var(--danger); }
.note {
  padding:13px;
  background:#f8f3e8;
  border-right:4px solid var(--gold);
  border-radius:8px;
  margin:15px 0;
  color:#51452e;
  font-size:13px;
}
.hp {
  position:absolute!important;
  right:-10000px!important;
  width:1px!important;
  height:1px!important;
  overflow:hidden!important;
}
footer {
  border-top:1px solid var(--line);
  padding:22px 0;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}
@media(max-width:600px) {
  .grid { grid-template-columns:1fr; }
  .card { padding:16px; }
  h1 { font-size:21px; }
  .tabs button { flex

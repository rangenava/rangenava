<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت رنگ‌نوا</title>
<style>
body{font-family:Tahoma,sans-serif;background:#f4f1eb;color:#292929;margin:0;padding:20px}
main{max-width:850px;margin:35px auto;background:white;padding:25px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{color:#76533e}
input,button{padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font:inherit;max-width:100%}
button{background:#76533e;color:white;cursor:pointer}
.card{background:#f7f4ef;padding:18px;border-radius:12px;margin:12px 0}
#dashboard{display:none}
small{color:#777}
</style>
</head>
<body>
<main>
<h1>پنل مدیریت رنگ‌نوا</h1>
<p>ورود مدیر و مشاهده آمار بازدید سایت</p>

<section id="login">
<input id="email" type="email" placeholder="ایمیل مدیر">
<br>
<input id="password" type="password" placeholder="رمز عبور">
<br>
<button onclick="login()">ورود</button>
<p id="message"></p>
</section>

<section id="dashboard">
<h2>آمار بازدید</h2>
<div class="card">کل بازدیدها: <b id="total">—</b></div>
<div class="card">بازدید امروز: <b id="today">—</b></div>
<div class="card">بازدید هفته: <b id="week">—</b></div>
<div class="card">بازدید ماه: <b id="month">—</b></div>
<h3>صفحات پربازدید</h3>
<div id="pages">در حال دریافت اطلاعات...</div>
<button onclick="loadStats()">به‌روزرسانی آمار</button>
<button onclick="logout()">خروج</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rangenava-config.js"></script>
<script>
const db = supabase.createClient(
  window.RANGENAVA_CONFIG.url,
  window.RANGENAVA_CONFIG.anonKey
);

async function login(){
  const {data,error}=await db.auth.signInWithPassword({
    email:document.getElementById('email').value,
    password:document.getElementById('password').value
  });
  if(error){document.getElementById('message').textContent=error.message;return;}
  await checkAdmin();
}

async function checkAdmin(){
  const {data:{user}}=await db.auth.getUser();
  if(!user)return;
  const {data,error}=await db.from('admin_users')
    .select('user_id').eq('user_id',user.id).eq('is_active',true).maybeSingle();
  if(error||!data){
    document.getElementById('message').textContent='دسترسی مدیر تأیید نشد.';
    await db.auth.signOut();return;
  }
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  loadStats();
}

async function loadStats(){
  const {data,error}=await db.from('page_views')
    .select('path,created_at');
  if(error){document.getElementById('pages').textContent='خطا در دریافت آمار';return;}
  const rows=data||[];
  const now=new Date();
  const startToday=new Date(now);startToday.setHours(0,0,0,0);
  const startWeek=new Date(now);startWeek.setDate(now.getDate()-6);startWeek.setHours(0,0,0,0);
  const startMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const countSince=(date)=>rows.filter(x=>new Date(x.created_at)>=date).length;

  document.getElementById('total').textContent=rows.length;
  document.getElementById('today').textContent=countSince(startToday);
  document.getElementById('week').textContent=countSince(startWeek);
  document.getElementById('month').textContent=countSince(startMonth);

  const counts={};
  rows.forEach(x=>{const p=x.path||'/';counts[p]=(counts[p]||0)+1;});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  document.getElementById('pages').innerHTML=sorted.length
    ? sorted.map(x=>`<div class="card">${x[0]} — ${x[1]} بازدید</div>`).join('')
    : 'هنوز بازدیدی ثبت نشده است.';
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

checkAdmin();
</script>
</body>
</html>

<script src="rangenava-config.js"></script>

<script>
(function(){

"use strict";

const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

const refreshButton = document.getElementById("refreshButton");

function showError(text){
  message.textContent = text;
}

function setNumber(id,value){
  document.getElementById(id).textContent =
    Number(value).toLocaleString("fa-IR");
}

function initialize(){

  if(!window.supabase){
    showError("کتابخانه Supabase بارگذاری نشده است. اتصال اینترنت را بررسی کنید.");
    return false;
  }

  const config = window.RANGENAVA_CONFIG;

  if(!config || !config.url || !config.anonKey){
    showError("تنظیمات اتصال Supabase پیدا نشد. فایل rangenava-config.js را بررسی کنید.");
    return false;
  }

  try{
    db = window.supabase.createClient(
      config.url,
      config.anonKey
    );
    return true;
  }catch(error){
    showError("خطا در ساخت اتصال: " + error.message);
    return false;
  }
}

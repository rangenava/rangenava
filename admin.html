<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245b52">
<title>پنل مدیریت | رنگ‌نوا</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17212b;--muted:#64748b;--line:#e2e8f0;--brand:#245b52;--brand2:#347c70;--danger:#b42318;--ok:#18794e;--shadow:0 8px 28px #17212b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:var(--brand);color:#fff}button:hover{background:var(--brand2)}button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{max-width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}input{width:100%}
.wrap{max-width:1200px;margin:auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
h1,h2,h3{margin:0 0 12px}h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}p{margin:6px 0;color:var(--muted)}
.login{max-width:440px;margin:7vh auto}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:bold}
.status{padding:10px 13px;border-radius:9px;background:#eef2f6;color:#334155;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fff0ef;color:var(--danger)}.status.success{background:#eaf7ef;color:var(--ok)}
.hidden{display:none!important}.top{display
